<style>

.continue.pulse{animation:continuePulse .28s ease}

@media(max-width:600px){.top{height:58px;padding:6px}.top button{padding:9px 8px}.correctBox{font-size:14px}.timer{font-size:18px}.screen{padding:10px}.startCard{padding:22px}.page{min-height:calc(100svh - 82px);padding:15px 12px 12px}.qtext{font-size:18px}.opt{padding:10px;font-size:16px}.resultGrid{grid-template-columns:1fr}.book{padding:4px}}

function loadResults(){let a=JSON.parse(localStorage.getItem("bikash_results")||"[]"),l=document.getElementById("list");l.innerHTML=a.length?a.map((x,i)=>`<div class="adminRow"><b>Rank ${i+1} — ${esc(x.name)}</b><br>Score: ${x.score} | Percentage: ${x.pct}% | Correct: ${x.correct} | Incorrect: ${x.incorrect} | Attempted: ${x.attempted} | Unanswered: ${x.unanswered} | Time: ${x.timeUsed}<br><span class="small">${x.completed}</span></div>`).join(""):"No saved results."}
function downloadCSV(){let a=JSON.parse(localStorage.getItem("bikash_results")||"[]"),rows=[["Rank","Candidate Name","Score","Time used","percentage","Completed Date/Time"],...a.map((x,i)=>[i+1,x.name,x.score,x.timeUsed,x.pct,x.completed])];let csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),aEl=document.createElement("a");aEl.href=u;aEl.download="bikash-academy-results.csv";aEl.click();URL.revokeObjectURL(u)}
function editor(){let e=document.getElementById("editor");e.innerHTML=`<div class="editQ"><h3>Question & Answer-Key Editor</h3><p class="small">Admin can edit every question, option and correct option. Changes are saved only on this device.</p>${QUESTIONS.map((q,i)=>`<details><summary>Q${i+1}</summary><textarea id="q${i}">${q[0]}</textarea>${q[1].map((o,j)=>`<input id="o${i}_${j}" value="${o.replace(/"/g,"&quot;")}">`).join("")}<select id="a${i}" style="width:100%;padding:10px;background:#020305;color:#fff"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></details>`).join("")}<button class="startBtn" id="saveEdit">SAVE QUESTION SET</button></div>`;QUESTIONS.forEach((q,i)=>document.getElementById("a"+i).value=q[2]);document.getElementById("saveEdit").onclick=()=>{QUESTIONS.forEach((q,i)=>{q[0]=document.getElementById("q"+i).value;q[1]=[0,1,2,3].map(j=>document.getElementById("o"+i+"_"+j).value);q[2]=+document.getElementById("a"+i).value});alert("Question set and answer keys saved on this device.")}}
document.getElementById("adminBtn").onclick=admin;document.getElementById("themeBtn").onclick=()=>document.documentElement.style.setProperty("--neon",getComputedStyle(document.documentElement).getPropertyValue("--neon").trim()==="#00eaff"?"#ff4dff":"#00eaff");
startScreen();
</script>
</body></html>
